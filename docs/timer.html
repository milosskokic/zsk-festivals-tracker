<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Stage Countdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;500;700&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0c0a;
    --panel: #1a1f16;
    --fg: #eef1ec;
    --dim: #5c6259;
    --line: #24281f;
    --accent: #35d488;
    --danger: #ef4a4a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    font-family: 'IBM Plex Sans', -apple-system, Helvetica, Arial, sans-serif;
  }

  #app {
    position: relative;
    height: 100%;
  }

  #setupScreen, #timerScreen {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  #app[data-screen="setup"] #setupScreen { display: flex; }
  #app[data-screen="timer"] #timerScreen { display: flex; }

  /* ---------- setup screen ---------- */

  #setupScreen { gap: 1.6rem; padding: 4vh 1.5rem; }
  .setupHead { text-align: center; max-width: 32rem; }
  .setupHead h1 {
    font-size: 1.3rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0 0 0.5rem;
  }
  .setupHead p {
    font-size: 0.9rem;
    color: var(--dim);
    margin: 0;
    line-height: 1.5;
  }
  .setupCard {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 1.5rem;
    width: min(92vw, 440px);
    max-height: 52vh;
    overflow-y: auto;
  }
  .segRow {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 0.55rem;
  }
  .segRow .swatch {
    width: 0.7rem;
    height: 0.7rem;
    border-radius: 50%;
    flex: none;
  }
  .segRow input[type="text"] {
    flex: 1;
    min-width: 0;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--fg);
    font: inherit;
    font-family: 'IBM Plex Sans', sans-serif;
    padding: 0.55em 0.7em;
    border-radius: 5px;
  }
  .segRow input[type="number"] {
    width: 4.4rem;
    background: var(--bg);
    border: 1px solid var(--line);
    color: var(--fg);
    font-family: 'JetBrains Mono', monospace;
    font-variant-numeric: tabular-nums;
    text-align: center;
    padding: 0.55em 0.3em;
    border-radius: 5px;
  }
  .segRow input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .segRow .rm {
    background: none;
    border: none;
    color: var(--dim);
    font-size: 1.1rem;
    padding: 0.2em 0.4em;
  }
  .segRow .rm:hover { color: var(--danger); }
  #addSeg {
    width: 100%;
    background: none;
    border: 1px dashed var(--line);
    color: var(--dim);
    margin-top: 0.3rem;
  }
  #addSeg:hover { color: var(--fg); border-color: var(--dim); }
  .setupFoot {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 1.3rem;
    padding-top: 1rem;
    border-top: 1px solid var(--line);
  }
  #segTotal {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    color: var(--dim);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- shared buttons ---------- */

  button {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--fg);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    padding: 0.65em 1.3em;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 0.01em;
  }
  button:hover { border-color: var(--dim); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button:disabled { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
  button.primary { border-color: var(--accent); color: var(--accent); }
  button.primary:hover { background: rgba(53, 212, 136, 0.08); }
  button.ghost { background: none; color: var(--dim); border-color: transparent; }
  button.ghost:hover { color: var(--fg); border-color: var(--line); }
  #continueBtn { font-size: 1.05rem; padding: 0.75em 2.4em; }

  /* ---------- timer screen ---------- */

  .corner {
    position: fixed;
    width: 2.6vw;
    height: 2.6vw;
    max-width: 34px;
    max-height: 34px;
    border: 2px solid var(--line);
    opacity: 0.9;
    transition: opacity 0.4s ease;
    pointer-events: none;
  }
  .corner.tl { top: 3vh; left: 3vh; border-right: none; border-bottom: none; }
  .corner.tr { top: 3vh; right: 3vh; border-left: none; border-bottom: none; }
  .corner.bl { bottom: 7.5vh; left: 3vh; border-right: none; border-top: none; }
  .corner.br { bottom: 7.5vh; right: 3vh; border-left: none; border-top: none; }

  #segmentLabel {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--dim);
    display: none;
    gap: 0.6em;
    align-items: baseline;
    margin-bottom: 1.6rem;
  }
  #segmentLabel .count { color: var(--dim); font-weight: 400; }
  #timerScreen.agenda #segmentLabel { display: flex; }
  #segmentLabel.seg-flash { animation: labelPop 0.5s ease-out; }

  #clockWrap {
    position: relative;
    display: flex;
    align-items: baseline;
    gap: 0.03em;
  }
  #clockWrap.seg-flash { animation: clockPop 0.6s cubic-bezier(.34,1.56,.64,1); }
  #clock {
    font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
    font-size: 22vw;
    font-weight: 300;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.03em;
    transition: color 0.4s ease;
  }
  #clock.danger { color: var(--danger); }

  #unit {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--dim);
    align-self: center;
    transform: translateY(-0.3em);
  }

  /* small readout for the currently-running agenda slot, beneath the big total */
  #slotClock {
    display: none;
    align-items: baseline;
    gap: 0.5em;
    font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
    font-size: 4.2vw;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    color: var(--fg);
    opacity: 0.82;
    margin-top: 1.6rem;
    transition: color 0.4s ease;
  }
  #timerScreen.agenda #slotClock { display: flex; }
  #slotClock.seg-flash { animation: clockPop 0.6s cubic-bezier(.34,1.56,.64,1); }
  #slotClock.danger { color: var(--danger); opacity: 1; }
  #slotClock .slotUnit {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--dim);
  }

  #controls {
    display: flex;
    align-items: center;
    gap: 1.6rem;
    opacity: 0.7;
    transition: opacity 0.3s ease;
    margin-top: 3rem;
  }
  #timerScreen.hide-ui #controls,
  #timerScreen.hide-ui #hint,
  #timerScreen.hide-ui .corner {
    opacity: 0;
    pointer-events: none;
  }
  #controls:hover { opacity: 1; }

  #hint {
    position: fixed;
    bottom: 8.4vh;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: var(--dim);
    opacity: 0.6;
    transition: opacity 0.3s ease;
    white-space: nowrap;
  }

  /* remaining-time bar — the main stage instrument, always on, one colour per slot */
  #barDock {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 0.6rem 0.6rem calc(0.7rem + env(safe-area-inset-bottom, 0px));
    background: linear-gradient(to top, rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0));
  }
  #barInner {
    position: relative;
    display: flex;
    flex-direction: column;
  }
  #capRow {
    display: none;
    gap: 6px;
    padding: 0 2px 0.4rem;
  }
  #timerScreen.agenda #capRow { display: flex; }
  #capRow .cap {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--dim);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: color 0.3s ease;
  }
  #capRow .cap.current { color: var(--fg); }
  #capRow .cap.done { color: var(--dim); }
  #trackRow {
    display: flex;
    gap: 6px;
    height: 2.4vh;
    min-height: 18px;
    max-height: 30px;
  }
  .cell {
    position: relative;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 5px;
    overflow: hidden;
    transition: border-color 0.4s ease;
  }
  .cell .fill {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 0%;
    background: var(--accent);
    transition: width 0.3s linear, background-color 0.4s ease;
  }
  .cell .fill.danger { background: var(--danger); }
  .cell .fill.done { background: var(--dim); }
  .cell.urgent {
    animation: urgentPulse 1s ease-in-out infinite;
  }
  .cell.seg-flash {
    animation: segFlashCell 0.7s cubic-bezier(.34,1.56,.64,1), segFlashGlow 0.7s ease-out;
    z-index: 1;
  }

  /* playhead — marks the current position across the whole agenda, on top of the segment fills */
  #playhead {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 0;
    display: none;
    pointer-events: none;
    z-index: 5;
    transition: left 0.3s linear;
  }
  #timerScreen.agenda #playhead { display: block; }
  #playhead .needle {
    position: absolute;
    left: -1px;
    top: 0.9rem;
    bottom: 0;
    width: 2px;
    background: var(--fg);
    box-shadow: 0 0 4px rgba(0, 0, 0, 0.7);
  }
  #playhead .knob {
    position: absolute;
    left: -6px;
    top: -0.1rem;
    width: 0;
    height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 8px solid var(--fg);
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.6));
  }

  @keyframes segFlashCell {
    0% { transform: scaleY(1); }
    30% { transform: scaleY(2.1); }
    100% { transform: scaleY(1); }
  }
  @keyframes segFlashGlow {
    0% { box-shadow: 0 0 0 rgba(0, 0, 0, 0); }
    30% { box-shadow: 0 0 22px 2px var(--flash-color, rgba(255, 255, 255, 0.8)); }
    100% { box-shadow: 0 0 0 rgba(0, 0, 0, 0); }
  }
  @keyframes urgentPulse {
    0%, 100% { box-shadow: 0 0 8px 1px rgba(239, 74, 74, 0.55); }
    50% { box-shadow: 0 0 2px 0 rgba(239, 74, 74, 0.15); }
  }
  @keyframes labelPop {
    0% { opacity: 0; transform: translateY(8px); }
    60% { opacity: 1; }
    100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes clockPop {
    0% { transform: scale(1); }
    40% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div id="app" data-screen="setup">

  <div id="setupScreen">
    <div class="setupHead">
      <h1>Set your slots</h1>
      <p>One slot is a plain countdown. Add more to build an agenda that steps through them on its own — e.g. 5m intro, 20m lecture, 10m Q&amp;A.</p>
    </div>
    <div class="setupCard">
      <div id="segRows"></div>
      <button id="addSeg">+ Add slot</button>
      <div class="setupFoot">
        <span id="segTotal">Total 45 min</span>
        <button id="resetSetupBtn" class="ghost">Reset</button>
      </div>
    </div>
    <button id="continueBtn" class="primary">Continue</button>
  </div>

  <div id="timerScreen">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div id="segmentLabel"><span id="segName">Intro</span><span class="count" id="segCount">1 / 3</span></div>

    <div id="clockWrap">
      <div id="clock">45:00</div>
      <span id="unit">min</span>
    </div>

    <div id="slotClock"><span id="slotTime">05:00</span><span class="slotUnit">this slot</span></div>

    <div id="controls">
      <button id="editBtn" class="ghost">Edit</button>
      <button id="resetBtn">Reset</button>
      <button id="toggleBtn" class="primary">Start</button>
      <button id="fsBtn">Fullscreen</button>
    </div>

    <div id="hint">space start/pause &nbsp; r reset &nbsp; f fullscreen &nbsp; e edit</div>

    <div id="barDock">
      <div id="barInner">
        <div id="capRow"></div>
        <div id="trackRow"></div>
        <div id="playhead"><div class="knob"></div><div class="needle"></div></div>
      </div>
    </div>
  </div>

</div>

<script>
(function () {
  const DEFAULT_SECONDS = 45 * 60;
  const PALETTE = ['#35d488', '#4f9dff', '#f2b134', '#ef8a3d', '#b98ce8', '#38c6c6'];

  const appEl = document.getElementById('app');
  const setupScreenEl = document.getElementById('setupScreen');
  const timerScreenEl = document.getElementById('timerScreen');

  const clockEl = document.getElementById('clock');
  const clockWrapEl = document.getElementById('clockWrap');
  const unitEl = document.getElementById('unit');
  const slotClockEl = document.getElementById('slotClock');
  const slotTimeEl = document.getElementById('slotTime');
  const segmentLabelEl = document.getElementById('segmentLabel');
  const segNameEl = document.getElementById('segName');
  const segCountEl = document.getElementById('segCount');
  const toggleBtn = document.getElementById('toggleBtn');
  const resetBtn = document.getElementById('resetBtn');
  const fsBtn = document.getElementById('fsBtn');
  const editBtn = document.getElementById('editBtn');
  const capRowEl = document.getElementById('capRow');
  const trackRowEl = document.getElementById('trackRow');
  const playheadEl = document.getElementById('playhead');
  const hintEl = document.getElementById('hint');

  const segRowsEl = document.getElementById('segRows');
  const segTotalEl = document.getElementById('segTotal');
  const addSegBtn = document.getElementById('addSeg');
  const resetSetupBtn = document.getElementById('resetSetupBtn');
  const continueBtn = document.getElementById('continueBtn');

  // queue: ordered list of slots. Plain "simple" mode is a single unnamed slot.
  let queue = [{ name: '', seconds: DEFAULT_SECONDS }];
  let currentIndex = 0;
  let remaining = queue[0].seconds;
  let running = false;
  let endTime = null;
  let tickHandle = null;
  let uiTimer = null;
  let editRows = [{ name: '', minutes: 45 }];

  let cellEls = [];
  let fillEls = [];
  let capEls = [];

  function isAgenda() { return queue.length > 1; }
  function segColor(i) { return PALETTE[i % PALETTE.length]; }

  function hexToRgba(hex, a) {
    const n = parseInt(hex.slice(1), 16);
    const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + a + ')';
  }

  function format(s) {
    s = Math.max(0, Math.round(s));
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return (m < 100 ? String(m).padStart(2, '0') : String(m)) + ':' + String(sec).padStart(2, '0');
  }

  // total across every slot, and what's left of that total from here on
  function totalQueueSeconds() {
    return queue.reduce((sum, s) => sum + s.seconds, 0);
  }
  function totalRemainingSeconds() {
    let sum = remaining;
    for (let i = currentIndex + 1; i < queue.length; i++) sum += queue[i].seconds;
    return sum;
  }

  // --- bar: built once per queue change, updated every tick ---

  function buildBar() {
    trackRowEl.innerHTML = '';
    capRowEl.innerHTML = '';
    cellEls = []; fillEls = []; capEls = [];
    const agenda = isAgenda();
    queue.forEach((slot, i) => {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.style.flexGrow = String(slot.seconds);
      cell.style.borderColor = agenda ? hexToRgba(segColor(i), 0.55) : 'rgba(255, 255, 255, 0.18)';
      if (agenda) {
        cell.style.setProperty('--flash-color', hexToRgba(segColor(i), 0.9));
      }
      const fill = document.createElement('div');
      fill.className = 'fill';
      cell.appendChild(fill);
      trackRowEl.appendChild(cell);
      cellEls.push(cell);
      fillEls.push(fill);

      if (agenda) {
        const cap = document.createElement('div');
        cap.className = 'cap';
        cap.style.flexGrow = String(slot.seconds);
        cap.textContent = slot.name || ('Slot ' + (i + 1));
        capRowEl.appendChild(cap);
        capEls.push(cap);
      }
    });
  }

  function updateBar() {
    const agenda = isAgenda();
    queue.forEach((slot, i) => {
      const fill = fillEls[i];
      const cell = cellEls[i];
      let danger = false;
      fill.classList.remove('done', 'danger');
      if (i < currentIndex) {
        // already spent: shown as a fully consumed (dim) bucket, not "remaining"
        fill.style.width = '100%';
        fill.style.background = '';
        fill.classList.add('done');
      } else if (i === currentIndex) {
        // remaining time in the active slot: starts full, drains to empty
        const pct = 100 * remaining / slot.seconds;
        fill.style.width = Math.min(100, Math.max(0, pct)) + '%';
        danger = remaining <= 60;
        fill.style.background = danger ? '' : (agenda ? segColor(i) : '');
        if (danger) fill.classList.add('danger');
      } else {
        fill.style.width = '0%';
        fill.style.background = '';
      }
      cell.classList.toggle('urgent', i === currentIndex && danger);
      if (agenda && capEls[i]) {
        capEls[i].classList.toggle('current', i === currentIndex);
        capEls[i].classList.toggle('done', i < currentIndex);
      }
    });
  }

  function updatePlayhead() {
    if (!isAgenda()) return;
    const total = totalQueueSeconds();
    const elapsed = total - totalRemainingSeconds();
    const pct = total > 0 ? Math.min(100, Math.max(0, 100 * elapsed / total)) : 0;
    playheadEl.style.left = pct + '%';
  }

  function flashSegmentChange() {
    [clockWrapEl, slotClockEl, segmentLabelEl, cellEls[currentIndex]].forEach((el) => {
      if (!el) return;
      el.classList.remove('seg-flash');
      void el.offsetWidth; // restart the animation
      el.classList.add('seg-flash');
      el.addEventListener('animationend', () => el.classList.remove('seg-flash'), { once: true });
    });
    if (navigator.vibrate) navigator.vibrate([50, 60, 50]);
  }

  function render() {
    const slot = queue[currentIndex];
    const totalRemaining = totalRemainingSeconds();

    clockEl.textContent = format(totalRemaining);
    clockEl.classList.toggle('danger', totalRemaining <= 60);
    unitEl.textContent = running || totalRemaining !== totalQueueSeconds() ? 'left' : 'min';

    slotTimeEl.textContent = format(remaining);
    slotClockEl.classList.toggle('danger', remaining <= 60);

    timerScreenEl.classList.toggle('agenda', isAgenda());
    segNameEl.textContent = slot.name || ('Slot ' + (currentIndex + 1));
    segCountEl.textContent = (currentIndex + 1) + ' / ' + queue.length;

    editBtn.disabled = running;

    updateBar();
    updatePlayhead();
  }

  function tick() {
    remaining = (endTime - Date.now()) / 1000;
    if (remaining <= 0) {
      if (currentIndex < queue.length - 1) {
        currentIndex++;
        remaining = queue[currentIndex].seconds;
        endTime = Date.now() + remaining * 1000;
        flashSegmentChange();
      } else {
        remaining = 0;
        stop();
        if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      }
    }
    render();
  }

  function start() {
    if (running) return;
    if (remaining <= 0) {
      if (currentIndex < queue.length - 1) { currentIndex++; remaining = queue[currentIndex].seconds; }
      else return;
    }
    running = true;
    endTime = Date.now() + remaining * 1000;
    tickHandle = setInterval(tick, 200);
    toggleBtn.textContent = 'Pause';
    render();
  }

  function stop() {
    running = false;
    clearInterval(tickHandle);
    toggleBtn.textContent = 'Start';
    render();
  }

  function toggle() {
    running ? stop() : start();
  }

  function reset() {
    stop();
    currentIndex = 0;
    remaining = queue[0].seconds;
    render();
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  }

  // --- setup screen ---

  function renderEditor() {
    segRowsEl.innerHTML = '';
    editRows.forEach((row, i) => {
      const r = document.createElement('div');
      r.className = 'segRow';

      const swatch = document.createElement('span');
      swatch.className = 'swatch';
      swatch.style.background = segColor(i);

      const nameInput = document.createElement('input');
      nameInput.type = 'text';
      nameInput.placeholder = 'Slot name';
      nameInput.value = row.name;
      nameInput.addEventListener('input', () => { row.name = nameInput.value; });

      const minInput = document.createElement('input');
      minInput.type = 'number';
      minInput.min = '0';
      minInput.max = '180';
      minInput.value = row.minutes;
      minInput.addEventListener('input', () => {
        row.minutes = Math.max(0, parseFloat(minInput.value) || 0);
        updateTotal();
      });

      const rm = document.createElement('button');
      rm.className = 'rm';
      rm.textContent = '×';
      rm.setAttribute('aria-label', 'Remove slot');
      rm.addEventListener('click', () => { editRows.splice(i, 1); renderEditor(); });

      r.appendChild(swatch);
      r.appendChild(nameInput);
      r.appendChild(minInput);
      r.appendChild(rm);
      segRowsEl.appendChild(r);
    });
    updateTotal();
  }

  function updateTotal() {
    const total = editRows.reduce((sum, r) => sum + (r.minutes || 0), 0);
    segTotalEl.textContent = 'Total ' + total + ' min';
  }

  function showSetup() {
    if (running) return;
    editRows = queue.map((s, i) => ({ name: s.name || (isAgenda() ? 'Slot ' + (i + 1) : ''), minutes: Math.round(s.seconds / 60) }));
    renderEditor();
    appEl.dataset.screen = 'setup';
  }

  function showTimer() {
    appEl.dataset.screen = 'timer';
  }

  function resetSetupRows() {
    editRows = [{ name: '', minutes: 45 }];
    renderEditor();
  }

  function continueSetup() {
    const clean = editRows.filter((r) => r.minutes > 0);
    if (clean.length === 0) {
      queue = [{ name: '', seconds: DEFAULT_SECONDS }];
    } else if (clean.length === 1) {
      queue = [{ name: '', seconds: Math.max(60, Math.round(clean[0].minutes * 60)) }];
    } else {
      queue = clean.map((r, i) => ({
        name: r.name.trim() || ('Slot ' + (i + 1)),
        seconds: Math.max(60, Math.round(r.minutes * 60)),
      }));
    }
    currentIndex = 0;
    remaining = queue[0].seconds;
    buildBar();
    stop();
    showTimer();
  }

  toggleBtn.addEventListener('click', toggle);
  resetBtn.addEventListener('click', reset);
  fsBtn.addEventListener('click', toggleFullscreen);
  editBtn.addEventListener('click', showSetup);

  addSegBtn.addEventListener('click', () => {
    editRows.push({ name: 'Slot ' + (editRows.length + 1), minutes: 0 });
    renderEditor();
  });
  resetSetupBtn.addEventListener('click', resetSetupRows);
  continueBtn.addEventListener('click', continueSetup);

  document.addEventListener('keydown', (e) => {
    if (appEl.dataset.screen !== 'timer') return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.key === 'r' || e.key === 'R') reset();
    else if (e.key === 'f' || e.key === 'F') toggleFullscreen();
    else if (e.key === 'e' || e.key === 'E') showSetup();
  });

  function wakeUi() {
    timerScreenEl.classList.remove('hide-ui');
    clearTimeout(uiTimer);
    uiTimer = setTimeout(() => {
      if (running) timerScreenEl.classList.add('hide-ui');
    }, 3000);
  }
  ['mousemove', 'touchstart', 'keydown'].forEach((ev) =>
    document.addEventListener(ev, wakeUi)
  );
  wakeUi();

  renderEditor();
  buildBar();
  render();
})();
</script>
</body>
</html>
